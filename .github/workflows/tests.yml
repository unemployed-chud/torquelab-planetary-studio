name: Validate gear physics
on:
  push:
  pull_request:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Physics and geometry tests
        run: npm test
